
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          set -euxo pipefail
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install Capacitor
        run: |
          set -euxo pipefail
          npm install

      - name: Create Android project
        run: |
          set -euxo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Set app icon
        run: |
          set -euxo pipefail
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            mkdir -p android/app/src/main/res/mipmap-$n
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build APK
        working-directory: android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Rohan-Journal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
